name: SD Ceara Games - FunTuna V2 Splash e Progresso SDK Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-installer:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    timeout-minutes: 45
    steps:
      - name: Baixar fork do FunTuna
        uses: actions/checkout@v4

      - name: Instalar dependencias
        shell: sh
        run: apk add --no-cache python3 build-base git zip

      - name: Preparar ferramenta bin2s ausente no PS2DEV
        shell: sh
        run: |
          set -eu
          mkdir -p /tmp/sdceara-tools
          cat > /tmp/sdceara-tools/bin2s <<'PYBIN2S'
          #!/usr/bin/env python3
          """bin2s compativel com o instalador FunTuna (PS2 MIPS ELF)."""
          from pathlib import Path
          import re
          import sys

          if len(sys.argv) != 4:
              sys.exit('Uso: bin2s arquivo_entrada arquivo_saida.s simbolo')
          input_file = Path(sys.argv[1])
          output_file = Path(sys.argv[2])
          symbol = sys.argv[3]
          if not input_file.is_file():
              sys.exit(f'Arquivo ausente: {input_file}')
          if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', symbol):
              sys.exit(f'Simbolo invalido: {symbol}')
          # The assembler runs from the installer/ working directory, the
          # same working directory where make invoked this generator.
          escaped = input_file.as_posix().replace('\\', '\\\\').replace('"', '\\"')
          assembly = (
              '.section .rodata\n'
              '.balign 16\n'
              f'.global {symbol}\n'
              f'{symbol}:\n'
              f'.incbin "{escaped}"\n'
              '.balign 4\n'
              f'.global size_{symbol}\n'
              f'size_{symbol}:\n'
              f'.word {input_file.stat().st_size}\n'
          )
          output_file.write_text(assembly, encoding='utf-8')
          PYBIN2S
          chmod +x /tmp/sdceara-tools/bin2s
          echo '/tmp/sdceara-tools' >> "$GITHUB_PATH"

      - name: Personalizar instalador e integrar OPL XMB 1.0
        shell: sh
        run: python3 sdceara/aplicar_personalizacao.py .

      - name: Aplicar V2 - splash FreeMcBoot + barra de progresso
        shell: sh
        run: |
          set -eu
          python3 sdceara/aplicar_v2.py .
          test -s FreeMcBoot/splash.h
          test -s installer/SDCEARA/SD_WORKING.rgba

      - name: Compatibilizar FreeMcBoot antigo com PS2SDK atual
        shell: sh
        run: |
          set -eu
          python3 - <<'PYCOMPAT'
          from pathlib import Path

          # Only legacy FreeMcBoot sources are touched, and only in the
          # temporary GitHub Actions runner after the validated V2 patch.
          fm=Path('FreeMcBoot/Makefile.eeglobal')
          make= fm.read_text(encoding='latin-1')
          old='EE_CFLAGS := -G0 -D_EE -O2  -Wall $(EE_CFLAGS)'
          new='EE_CFLAGS := -G0 -D_EE -DNEWLIB_PORT_AWARE -O2  -Wall $(EE_CFLAGS)'
          if make.count(old)!=1:
              raise SystemExit('Makefile.eeglobal unexpected; refusing compatibility patch')
          fm.write_text(make.replace(old,new),encoding='latin-1')

          launcher=Path('FreeMcBoot/launcher2.c')
          c=launcher.read_text(encoding='latin-1')
          fixes=[
              ('#include <stdio.h>', '#include <stdio.h>\n#include <stdlib.h>',
               'stdlib declarations'),
              ('\t\t\tpadReset();',
               '\t\t\t/* PS2SDK moderno: padEnd() ja libera a biblioteca. */',
               'obsolete padReset'),
              ('CdvdDiscType_t cdmode;', 'int cdmode;',
               'legacy DVD media enum type')
          ]
          for before,after,desc in fixes:
              if c.count(before)!=1:
                  raise SystemExit(f'{desc}: expected exactly one old source anchor, found {c.count(before)}')
              c=c.replace(before,after,1)
          launcher.write_text(c,encoding='latin-1')
          assert 'DNEWLIB_PORT_AWARE' in fm.read_text(encoding='latin-1')
          assert 'padReset();' not in c
          print('Legacy FreeMcBoot compatibility source patch: OK')
          PYCOMPAT

      - name: Recompilar FreeMcBoot com logo SD Ceara Games
        shell: sh
        run: |
          set -eu
          export PATH="/tmp/sdceara-tools:$PATH"
          # Must rebuild the original boot ELF, not merely patch the installer!
          # The FreeMcBoot source is legacy; fail closed if it cannot compile.
          make -C FreeMcBoot EE_PREFIX=mips64r5900el-ps2-elf- all
          test -s FreeMcBoot/BOOT.ELF
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          boot=Path('FreeMcBoot/BOOT.ELF')
          previous=Path('installer/INSTALLER_CONTENTS/BOOT/BOOT.ELF')
          assert boot.read_bytes().startswith(b'\x7fELF'), 'FreeMcBoot BOOT.ELF not valid'
          assert boot.read_bytes() != previous.read_bytes(), 'FreeMcBoot unchanged: refuse to publish'
          print('FreeMcBoot custom BOOT.ELF:',boot.stat().st_size,'SHA256',hashlib.sha256(boot.read_bytes()).hexdigest())
          PY
          cp FreeMcBoot/BOOT.ELF installer/INSTALLER_CONTENTS/BOOT/BOOT.ELF

      - name: Compilar instalador PS2 V2
        shell: sh
        run: |
          set -eu
          export PATH="/tmp/sdceara-tools:$PATH"
          cd installer
          make clean
          make
          test -s FunTuna-Fork_Installer.ELF
          cp FunTuna-Fork_Installer.ELF ../SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2-TESTE.ELF

      - name: Verificar binario
        shell: sh
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2-TESTE.ELF')
          assert p.read_bytes().startswith(b'\x7fELF'), 'O binario gerado nao e ELF'
          print('READY:', p.name, p.stat().st_size, 'bytes')
          PY
          sha256sum SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2-TESTE.ELF > SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2.sha256

      - name: Publicar ELF de teste
        uses: actions/upload-artifact@v4
        with:
          name: SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2-TESTE
          path: |
            SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2-TESTE.ELF
            SD-CEARA-GAMES-FUNTUNA-INSTALLER-V2.sha256
            sdceara-build-report.json
            FreeMcBoot/BOOT.ELF
          if-no-files-found: error
          retention-days: 30
