name: SD Ceara Games - FunTuna V1 com OPL v1.8 MX4SIO FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependencias
        shell: sh
        run: apk add --no-cache python3 build-base git zip
      - name: Preparar bin2s
        shell: sh
        run: |
          set -eu
          mkdir -p /tmp/sdceara-tools
          cat > /tmp/sdceara-tools/bin2s <<'PYBIN2S'
          #!/usr/bin/env python3
          from pathlib import Path
          import re,sys
          if len(sys.argv)!=4: sys.exit('Uso: bin2s entrada saida simbolo')
          src,dst,symbol=sys.argv[1:]
          if not Path(src).is_file(): sys.exit('Arquivo ausente: '+src)
          if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*',symbol): sys.exit('Simbolo invalido')
          escaped=Path(src).as_posix().replace('\\','\\\\').replace('"','\\"')
          Path(dst).write_text('.section .rodata\n.balign 16\n.global '+symbol+'\n'+symbol+':\n.incbin "'+escaped+'"\n.balign 4\n.global size_'+symbol+'\nsize_'+symbol+':\n.word '+str(Path(src).stat().st_size)+'\n')
          PYBIN2S
          chmod +x /tmp/sdceara-tools/bin2s
      - name: Aplicar personalizacao V1
        shell: sh
        run: python3 sdceara/aplicar_personalizacao.py .
      - name: Integrar somente OPL Evolution XMB v1.8 STABLE
        shell: sh
        run: |
          set -eu
          apk add --no-cache curl
          OPL_DEST="installer/INSTALLER_CONTENTS/APPS/OPNPS2LD.ELF"
          OPL_URL="https://github.com/zsplaygroup-sketch/OPL-Evolution/releases/download/v1.8-mx4sio-final/SD-CEARA-GAMES-EVOLUTION-XMB-v1.8-MX4SIO-FINAL.ELF"
          curl --fail --location --retry 3 --silent --show-error "$OPL_URL" -o /tmp/SD-CEARA-OPL-v1.8-stable.ELF
          python3 - <<'PYELF'
          from pathlib import Path
          import hashlib
          new=Path('/tmp/SD-CEARA-OPL-v1.8-stable.ELF')
          old=Path('installer/INSTALLER_CONTENTS/APPS/OPNPS2LD.ELF')
          data=new.read_bytes()
          expected='3319d825d79d68623ddde054f51b2ac616e57c5dcb2d44be753296109e8867c8'
          actual=hashlib.sha256(data).hexdigest()
          if actual!=expected:
              raise SystemExit('ERRO: OPL nao corresponde ao ELF final aprovado. SHA256: '+actual)
          if len(data)<100000 or data[:4]!=b'\x7fELF':
              raise SystemExit('ERRO: ELF v1.8 ausente ou invalido; compilacao cancelada')
          if not old.is_file():
              raise SystemExit('ERRO: destino OPL V1 ausente; compilacao cancelada')
          if data==old.read_bytes():
              raise SystemExit('ERRO: OPL nao foi substituido; compilacao cancelada')
          old.write_bytes(data)
          print('OPL v1.8 MX4SIO FINAL integrado; bytes:',len(data))
          print('SHA256 OPL:',hashlib.sha256(data).hexdigest())
          PYELF
      - name: Aplicar somente barra
        shell: sh
        run: python3 sdceara/aplicar_barra_somente.py .
      - name: Compilar instalador sem alterar FreeMcBoot
        shell: sh
        run: |
          set -eu
          export PATH="/tmp/sdceara-tools:$PATH"
          cd installer
          make clean
          make
          test -s FunTuna-Fork_Installer.ELF
          cp FunTuna-Fork_Installer.ELF ../SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE.ELF
      - name: Validar ELF e checksum
        shell: sh
        run: |
          set -eu
          python3 - <<'PYELF'
          from pathlib import Path
          p=Path('SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE.ELF')
          assert p.read_bytes()[:4]==b'\x7fELF'
          print('ELF:',p.stat().st_size,'bytes')
          PYELF
          sha256sum SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE.ELF > SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE.sha256
      - name: Publicar artefato experimental
        uses: actions/upload-artifact@v4
        with:
          name: SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE
          path: |
            SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE.ELF
            SD-CEARA-GAMES-FUNTUNA-V1-OPL-V18-MX4SIO-FINAL-TESTE.sha256
            sdceara-build-report.json
          if-no-files-found: error
